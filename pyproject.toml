[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentmd"
version = "0.1.0"
description = "The open standard for AI context in codebases."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Zachery Wilson" }]
keywords = ["ai", "llm", "context", "agents", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
agentmd = "agentmd.cli:app"

[project.urls]
Homepage = "https://github.com/zacwilson87/agentmd"
Repository = "https://github.com/zacwilson87/agentmd"
Issues = "https://github.com/zacwilson87/agentmd/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py311"
line-length = 100
